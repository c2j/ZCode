# 版本 tag 触发的 Linux 发行流水线。
#
# 产物（amd64 + arm64，双架构各用原生 runner 构建）：
# - 独立二进制（Node.js SEA）：zcode-linux-x64 / zcode-linux-arm64 + SHA-256。
# - 桌面版（Electron）：AppImage（packages/desktop/dist）。
#
# glibc 兼容性：SEA 基础二进制来自 nodejs.org 官方发行（Node 24.x 官方 Linux
# 构建基于 RHEL 8，最低要求 glibc 2.28），脚本会将官方二进制下载并注入 bundle。
# Electron 41 官方验证支持 Ubuntu 18.04+，桌面版同样可在 glibc 2.27 运行。
# 分发时请在发布说明中标注最低系统要求为 glibc 2.28（Ubuntu 20.04+ / RHEL 8+）。
#
# 架构矩阵：两个架构各用原生 runner（host target 构建后 build-sea.mjs 会自动
# 执行 --version 冒烟验证）。ubuntu-24.04-arm 对公共仓库免费；私有仓库需启用
# 对应付费 arm runner，否则任务会一直排队。
name: Release Linux Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-linux-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与 mise.toml / 根 package.json engines 保持一致；SEA 基础二进制版本取自构建机 Node。
  NODE_VERSION: "24.14.0"

jobs:
  build-linux:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # CLI 二进制构建不依赖 Electron 运行时，跳过其 postinstall 二进制下载。
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Assert Node version
        run: pnpm run ci:assert-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc -b 会为没有 build 脚本的 workspace 包（如 @zcode/shared）生成 dist，
      # SEA 资源收集依赖这些 dist 文件；同时保证发布产物先通过类型检查。
      - name: Typecheck and emit workspace dist files
        run: pnpm typecheck

      # 与包内 build:sea 脚本保持一致：先构建 CLI workspace 内除 CLI 外的所有包
      #（含仅作为 SEA 资源打包、而非 CLI 依赖的包，如 @zcode/node-repl-host），
      # 再单独构建 CLI bundle。根 packages/* 的 dist 由上一步 tsc -b 生成。
      - name: Build CLI workspace packages
        run: pnpm exec turbo --skip-infer --cwd apps/zcode-cli run build --filter=!@zcode/cli --force

      # 根 packages/* 中 CLI 依赖闭包内、有 build 脚本的包（如 @zcode/model-option-map，
      # tsc 构建产物被 SEA 资源收集引用），turbo（cwd 限定在 apps/zcode-cli）覆盖不到。
      - name: Build root workspace dependencies
        run: pnpm --filter "@zcode/cli..." --filter "!@zcode/cli" build

      - name: Build CLI bundle
        run: pnpm --filter @zcode/cli exec node scripts/build.mjs --sea

      # build-sea.mjs 按 target 下载 nodejs.org 官方二进制并校验 SHASUMS256；
      # native-search 工具在无内网源时解包仓库内 apps/zcode-cli/dependencies/native-search 归档。
      - name: Build SEA binary (linux-${{ matrix.arch }})
        run: pnpm --filter @zcode/cli exec node scripts/build-sea.mjs --target linux-${{ matrix.arch }}

      - name: Generate SHA-256 checksum
        working-directory: apps/zcode-cli/packages/cli/dist
        run: sha256sum "zcode-linux-${{ matrix.arch }}" > "zcode-linux-${{ matrix.arch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-linux-${{ matrix.arch }}
          path: |
            apps/zcode-cli/packages/cli/dist/zcode-linux-${{ matrix.arch }}
            apps/zcode-cli/packages/cli/dist/zcode-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error

  build-desktop-linux:
    name: Build desktop linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Assert Node version
        run: pnpm run ci:assert-node

      # 桌面版需要 Electron postinstall 二进制，不能跳过下载。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只出 AppImage：工具链 runner 自带，appimagetool 由 electron-builder 自动下载；
      # 不再需要 rpmbuild / bsdtar（deb/rpm/pacman 已下线）。
      - name: Bundle desktop app (linux-${{ matrix.arch }})
        run: pnpm bundle:desktop -- --os linux --arch ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-desktop-linux-${{ matrix.arch }}
          path: packages/desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-desktop-linux]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # 不合并 artifact：每个 artifact 落到 dist/<artifact 名>/，再逐目录打 zip，
      # 无需硬编码 electron-builder 的产物文件名。
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # 每个 artifact 打一个 zip（含二进制/安装包与其 sha256），并为 zip 生成校验文件。
      - name: Pack release archives
        working-directory: dist
        run: |
          for dir in */; do
            name="${dir%/}"
            zip -qr "${name}.zip" "$name"
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          done
          ls -la ./*.zip ./*.zip.sha256

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          # 删除并重推 tag 时 GitHub 会把已存在的 release 转成 draft，若沿用 "已存在则跳过创建"
          # 的分支，资产会上传成功但对外不可见（下载 404）。这里统一强制发布。
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.zip dist/*.zip.sha256
